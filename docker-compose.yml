services:
  # RDP Honeypot Service (.NET 10 LTS)
  rdphoney:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rdphoney
    restart: unless-stopped
    # Use host network mode on Linux so the honeypot receives the real client IP (avoids docker-proxy SNAT)
    network_mode: host
    environment:
      - DATABASE_PATH=/app/data/RdpHoneypotLogs.db
      - HONEYPOT_PORT=${HONEYPOT_PORT:-3389}
      - STATIC_JPG_PATH=/app/assets/desktop.jpg
      - AUTO_BAN_RDP_CLIENTS=${AUTO_BAN_RDP_CLIENTS:-true}
    volumes:
      # Host bind mount: exposes database directly on host machine (./data/RdpHoneypotLogs.db)
      - ./data:/app/data
      # Host bind mount: allows admin to customize static JPG without rebuilding container
      - ./assets:/app/assets

  # Database Web Administration UI (reachable from host machine at http://localhost:8080)
  db-admin:
    image: ghcr.io/coleifer/sqlite-web:latest
    container_name: rdphoney-db-admin
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./data:/data
    entrypoint:
      - /bin/sh
      - -c
      - |
        touch /data/RdpHoneypotLogs.db
        exec sqlite_web -H 0.0.0.0 -p ${DB_ADMIN_PORT:-8080} -x /data/RdpHoneypotLogs.db
    depends_on:
      - rdphoney
